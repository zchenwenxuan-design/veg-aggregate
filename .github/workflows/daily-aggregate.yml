name: 青菜数据每日汇总

on:
  schedule:
    # UTC时间0点 = 北京时间8点，每天触发
    - cron: '0 0 * * *'
  workflow_dispatch:
    # 支持手动触发

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 lark-cli
        id: lark_install
        run: |
          set +e  # 暂时禁用 set -e
          echo "=== 安装 lark-cli ==="
          npm install -g lark-cli 2>&1
          # 获取 npm 全局路径
          NPM_PATH=$(npm root -g)
          echo "npm global path: $NPM_PATH"
          # 修复权限
          chmod -R 755 "$NPM_PATH/lark-cli" 2>/dev/null || true
          ls -la "$NPM_PATH/lark-cli/" 2>/dev/null || echo "Cannot list"
          echo "=== 测试 lark-cli ==="
          "$NPM_PATH/lark-cli/bin/lark-cli.js" --version 2>/dev/null || "$NPM_PATH/lark-cli/bin/cli.js" --version 2>/dev/null || echo "Direct binary not found"
          echo "NPM_PATH=$NPM_PATH" >> $GITHUB_ENV

      - name: 获取飞书 Access Token
        id: get_token
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
        run: |
          # 通过 App ID + App Secret 获取 tenant_access_token
          TOKEN=$(curl -s -X POST https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal \
            -H "Content-Type: application/json" \
            -d "{\"app_id\":\"$LARK_APP_ID\",\"app_secret\":\"$LARK_APP_SECRET\"}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('tenant_access_token',''))")
          
          if [ -z "$TOKEN" ]; then
            echo "获取Token失败！"
            exit 1
          fi
          
          echo "Token获取成功"
          echo "LARKSUITE_CLI_APP_ID=$LARK_APP_ID" >> $GITHUB_ENV
          echo "LARKSUITE_CLI_USER_ACCESS_TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: 运行汇总脚本
        env:
          NPM_PATH: ${{ env.NPM_PATH }}
        run: |
          echo "=== 运行汇总脚本 ==="
          echo "NPM_PATH: $NPM_PATH"
          # 设置 PATH
          if [ -n "$NPM_PATH" ]; then
            export PATH="$NPM_PATH:$PATH"
          fi
          # 查找 lark-cli 并授权
          LARK_BIN=$(find "$NPM_PATH" -name "lark-cli*" -type f 2>/dev/null | head -1)
          echo "Found lark-cli: $LARK_BIN"
          if [ -n "$LARK_BIN" ]; then
            chmod +x "$LARK_BIN" 2>/dev/null || true
          fi
          python3 vegetable_summary.py

      - name: 运行结果
        if: always()
        run: |
          echo "===== 运行完成 ====="
          echo "执行时间: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')"
